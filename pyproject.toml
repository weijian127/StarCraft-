[project]
name = "sc2-predictor"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "mpyq==0.2.5",
    "numpy==1.23.5",
    "protobuf==3.20.3",
    "pysc2==3.0.0",
    "python-dotenv>=1.0,<2",
    "torch>=2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.optional-dependencies]
cuda = ["torch>=2.7,<3; sys_platform != 'darwin'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
